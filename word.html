<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Word</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Base styles for Soft UI/UX (Gray/Blue Palette) */
        body {
            font-family: 'Quicksand', sans-serif; /* Using Quicksand font as default */
            background-color: #e0e5ec; /* Soft background color */
            display: flex;
            flex-direction: column; /* Stack elements vertically in the body */
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem; /* Added padding for small screens */
            transition: background-color 0.3s ease; /* Smooth transition for theme change */
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* Style for the welcome text */
        .welcome-text {
            font-family: 'Quicksand', sans-serif; /* Use Quicksand font */
            color: #334155; /* Tailwind slate-700 */
            text-align: center;
            margin-bottom: 2rem; /* Space below the welcome text */
            font-size: 1.1em; /* Slightly larger font */
            max-width: 600px; /* Limit width for readability */
            line-height: 1.6; /* Improve readability */
            font-weight: 400; /* Quicksand Regular */
            transition: color 0.3s ease; /* Smooth transition */
        }

        .game-wrapper {
            display: flex; /* Use flexbox for horizontal layout */
            flex-direction: column; /* Stack vertically by default */
            align-items: center;
            gap: 2rem; /* Gap between sections */
            max-width: 900px; /* Increased max width for horizontal layout */
            width: 100%;
            padding: 1rem; /* Padding around the wrapper */
        }

        @media (min-width: 768px) { /* Medium screens and up */
            .game-wrapper {
                flex-direction: row; /* Arrange horizontally on medium screens and up */
                align-items: flex-start; /* Align items to the top */
            }
        }

        .game-info-container {
             background-color: #e0e5ec; /* Match body background for "pressed in" effect */
            padding: 2rem; /* Increased padding */
            border-radius: 1rem; /* More rounded corners */
            box-shadow: 7px 7px 15px #bebebe,
                        -7px -7px 15px #ffffff; /* Soft Neumorphic shadow */
            text-align: center;
            width: 100%; /* Take full width on small screens */
             flex: 1; /* Allow this section to grow */
             position: relative; /* Needed for absolute positioning of toggle button and animation */
             transition: background-color 0.3s ease, box-shadow 0.3s ease; /* Smooth transition */
             overflow: hidden; /* Hide animation when outside container */
        }

         @media (min-width: 768px) { /* Medium screens and up */
            .game-info-container {
                width: auto; /* Auto width based on content/flex */
                 max-width: 400px; /* Limit max width even when horizontal */
            }
         }


        .game-keyboard-container {
             background-color: #e0e5ec; /* Match body background for "pressed in" effect */
            padding: 2rem; /* Increased padding */
            border-radius: 1rem; /* More rounded corners */
            box-shadow: 7px 7px 15px #bebebe,
                        -7px -7px 15px #ffffff; /* Soft Neumorphic shadow */

            width: 100%; /* Take full width on small screens */
             flex: 1; /* Allow this section to grow */
             transition: background-color 0.3s ease, box-shadow 0.3s ease; /* Smooth transition */
        }

         @media (min-width: 768px) { /* Medium screens and up */
            .game-keyboard-container {
                width: auto; /* Auto width based on content/flex */
                 max-width: 400px; /* Limit max width even when horizontal */
            }
         }


        /* Specific font for heading, intro text, and attempts */
        h1, #introText, #guesses {
            font-family: 'Lato', sans-serif; /* Using Lato font */
        }

        h1 {
            color: #334155; /* Tailwind slate-700 */
            margin-bottom: 0.5rem; /* Reduced space below heading */
            font-weight: 700; /* Lato Bold */
            transition: color 0.3s ease; /* Smooth transition */
             font-size: 1.8em; /* Increased base font size */
        }

         /* Responsive font size for heading */
        @media (min-width: 640px) { /* Small screens and up */
            h1 {
                font-size: 2em; /* Slightly larger on small screens */
            }
        }

        @media (min-width: 768px) { /* Medium screens and up */
            h1 {
                font-size: 2.2em; /* Even larger on medium screens and up */
            }
        }


        p {
             color: #475569; /* Tailwind slate-600 */
             margin-bottom: 1.5rem; /* Increased spacing */
             font-weight: 400; /* Quicksand Regular */
             transition: color 0.3s ease; /* Smooth transition */
        }

         #introText {
             font-weight: 400; /* Lato Regular */

         }

         #guesses {
             margin-top: 0.5rem; /* Keep original margin-top */

         }


        .word-display {
            height: auto; /* Allow height to adjust based on content */
            min-height: 3.5rem; /* Ensure minimum height */
            line-height: 1.5; /* Adjust line height for wrapping */
            border: none; /* Remove border */
            border-radius: 0.75rem; /* More rounded */
            text-align: center;
            font-size: 1.8em; /* Larger font size */

            justify-content: center;

        /* Keyboard Layout */
        .keyboard-grid {

            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); /* Responsive columns */

            margin-bottom: 1.5rem; /* Space below keyboard */

        .keyboard-button {

        .restart-button {

         .change-word-button:hover {
            background-color: #64748b; /* Tailwind slate-500 */
             box-shadow: 2px 2px 5px #bebebe,
                        -2px -2px 5px #ffffff; /* Smaller shadow */

         .change-word-button:active {
             background-color: #475569; /* Tailwind slate-600 */
              box-shadow: inset 3px 3px 7px #bebebe,

         /* Theme Toggle Button */
         .theme-toggle-button {
             position: absolute;
             top: 1rem;
             right: 1rem;
             background-color: transparent;
             border: none;
             cursor: pointer;
             font-size: 1.5em;

             transition: color 0.3s ease;

             align-items: center;
             justify-content: center;

             color: #1e293b; /* Darker color on hover */

                        -1px -1px 3px #ffffff; /* Smaller shadow on hover */

         .theme-toggle-button:active {
             box-shadow: inset 2px 2px 5px #bebebe,

         /* Dark Mode Styles (More Realistic Black Theme) */
         body.dark-mode {
             background-color: #181818; /* Very dark gray */

         .dark-mode .welcome-text {
             color: #ddd; /* Lighter text in dark mode */

         .dark-mode .game-keyboard-container {

         .dark-mode .keyboard-button:hover {
             box-shadow: 2px 2px 4px #111,
                        -2px -2px 4px #333; /* Smaller dark mode shadow on hover */

         }

         .dark-mode .keyboard-button:active {
              box-shadow: inset 3px 3px 6px #111,
                        inset -3px -3px 6px #333; /* Inset dark mode shadow on active */
              color: #fff; /* Lightest text when pressed */
         }


         .dark-mode .message {
             /* Message colors remain the same for consistency (green/orange/red) */
         }

         .dark-mode .attempts-display,
         .dark-mode .incorrect-guesses {
             color: #999; /* Slightly lighter gray */
         }

         .dark-mode .restart-button {
            background-color: #333; /* Dark gray */
            color: #eee; /* Light text */
            box-shadow: 4px 4px 8px #111,
                        -4px -4px 8px #444; /* Dark mode shadow */
         }
         .dark-mode .restart-button:hover {
             background-color: #444; /* Slightly lighter gray on hover */
             box-shadow: 2px 2px 4px #111,
                        -2px -2px 4px #444; /* Smaller dark mode shadow */
         }
         .dark-mode .restart-button:active {
             background-color: #555; /* Even lighter gray on active */
              box-shadow: inset 3px 3px 6px #111,
                        inset -3px -3px 6px #444; /* Inset dark mode shadow on active */
         }

          .dark-mode .change-word-button {
            background-color: #555; /* Dark gray */
            color: #eee; /* Light text */
            box-shadow: 4px 4px 8px #111,
                        -4px -4px 8px #444; /* Dark mode shadow */
         }
         .dark-mode .change-word-button:hover {
             background-color: #666; /* Slightly lighter gray on hover */
             box-shadow: 2px 2px 4px #111,
                        -2px -2px 4px #444; /* Smaller dark mode shadow */
         }
         .dark-mode .change-word-button:active {
             background-color: #777; /* Even lighter gray on active */
              box-shadow: inset 3px 3px 6px #111,
                        inset -3px -3px 6px #444; /* Inset dark mode shadow on active */
         }


         /* Theme Toggle Button */
         .theme-toggle-button {
             position: absolute;
             top: 1rem;
             right: 1rem;
             background-color: transparent;
             border: none;
             cursor: pointer;
             font-size: 1.5em;
             color: #475569; /* Default icon color */
             transition: color 0.3s ease;
             z-index: 10; /* Ensure it's above other elements */
             display: flex; /* Use flex to center icon */
             align-items: center;
             justify-content: center;
             width: 2.5rem; /* Set a fixed size for better touch target */
             height: 2.5rem;
             border-radius: 50%; /* Make it round */
             box-shadow: 3px 3px 7px #bebebe,
                        -3px -3px 7px #ffffff; /* Soft shadow for the button itself */
         }

         .theme-toggle-button:hover {
             color: #1e293b; /* Darker color on hover */
             box-shadow: 1px 1px 3px #bebebe,
                        -1px -1px 3px #ffffff; /* Smaller shadow on hover */
         }

         .theme-toggle-button:active {
             box-shadow: inset 2px 2px 5px #bebebe,
                        inset -2px -2px 5px #ffffff; /* Inset shadow on active */
         }

         /* Winning Word Animation */
         .winning-word-animation {
             position: absolute;
             bottom: 2rem; /* Start from below the word display */
             left: 50%;
             transform: translateX(-50%); /* Center horizontally */
             font-size: 2em; /* Larger font size for animation */
             font-weight: 700; /* Bold font */
             color: #22c55e; /* Green color for winning */
             opacity: 0; /* Start invisible */
             pointer-events: none; /* Don't block clicks */
             z-index: 5; /* Below the theme toggle, above other elements */
             font-family: 'Lato', sans-serif; /* Use Lato font for animation */
             white-space: nowrap; /* Prevent wrapping */
         }

         /* Keyframes for the firing animation */
         @keyframes fireUpWord {
             0% {
                 opacity: 0;
                 transform: translate(-50%, 0); /* Start position (centered horizontally, at bottom) */
             }
             50% {
                 opacity: 1;
                 transform: translate(-50%, -80px); /* Move up and become visible */
             }
             100% {
                 opacity: 0;
                 transform: translate(-50%, -150px); /* Continue moving up and fade out */
             }
         }

         /* Class to apply the animation */
         .winning-word-animation.animate {
             animation: fireUpWord 1.5s ease-out forwards; /* Apply the animation */

         /* Dark mode color for the winning word animation */
         body.dark-mode .winning-word-animation {

         }

         /* Link to Home button */
         .home-button {

            left: 1rem;

                         inset -2px -2px 5px #ffffff;

             transition: all 0.2s ease;

             outline: none;
             box-shadow: inset 1px 1px 3px #bebebe,
                         inset -1px -1px 3px #ffffff;

         /* Dark Mode Category Selection */
         .dark-mode .category-selection label {
             color: #bbb;

         .dark-mode .category-selection select {
             background-color: #222;

             box-shadow: inset 2px 2px 5px #111,
                         inset -2px -2px 5px #333;
         }
         .dark-mode .category-selection select:focus {
              box-shadow: inset 1px 1px 3px #111,
                         inset -1px -1px 3px #333;

    </style>
</head>
<body>
    <p class="welcome-text">
        Welcome to the Guess the Word game! Try to guess the secret word by guessing one letter at a time.
        You have a limited number of incorrect guesses. Good luck!
    </p>

    <div class="game-wrapper">
        <div class="game-info-container" id="gameInfoContainer">
             <a href="home.html" class="home-button" aria-label="Go to Home">
                 <i class="ph-house"></i>
             </a>

             <button id="themeToggle" class="theme-toggle-button" aria-label="Toggle theme">
                 <i class="ph-sun"></i> <i class="ph-moon hidden"></i>
            </button>

            <h1 class="text-xl sm:text-2xl font-bold">Guess the Word!</h1>

            <div class="category-selection">
                <label for="categorySelect">Choose a Category:</label>
                <select id="categorySelect">
                    </select>
            </div>

            <button id="changeWordButton" class="change-word-button">Change Word</button>


            <div id="wordDisplay" class="word-display text-xl sm:text-2xl"></div>

             <div id="winningWordAnimation" class="winning-word-animation"></div>


            <p id="message" class="message text-base sm:text-lg"></p>
            <p id="guesses" class="attempts-display text-sm sm:text-base"></p>
            <p id="incorrectGuesses" class="incorrect-guesses"></p>

            <button id="restartGame" class="restart-button hidden text-base sm:text-lg">Restart Game</button>
        </div>

        <div class="game-keyboard-container" id="gameKeyboardContainer">
             <div id="keyboard" class="keyboard-grid">
                 </div>
        </div>
    </div>

    <script>
        // JavaScript for the word guessing game logic and theme toggle

        let allWordCategories = []; // Array to hold all categories and words from JSON
        let currentCategoryWords = []; // Array to hold words for the selected category
        let secretWord; // The word the user needs to guess
        let maskedWord; // The word displayed with underscores
        let incorrectAttempts; // Counter for incorrect guesses
        let maxIncorrectAttempts = 6; // Maximum allowed incorrect guesses
        let guessedLetters; // Array to store guessed letters

        const wordDisplay = document.getElementById('wordDisplay');
        const messageElement = document.getElementById('message');
        const guessesElement = document.getElementById('guesses');
        const incorrectGuessesElement = document.getElementById('incorrectGuesses');
        const restartButton = document.getElementById('restartGame');
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body; // Reference to the body element
        const gameInfoContainer = document.getElementById('gameInfoContainer'); // Reference to the info container
        const gameKeyboardContainer = document.getElementById('gameKeyboardContainer'); // Reference to the keyboard container
        const winningWordAnimationElement = document.getElementById('winningWordAnimation'); // Element for the animation
        const keyboard = document.getElementById('keyboard'); // Reference to the keyboard container
        const categorySelect = document.getElementById('categorySelect'); // Reference to the category dropdown
        const changeWordButton = document.getElementById('changeWordButton'); // Reference to the Change Word button


        // Function to fetch words from JSON
        async function fetchWords() {
            try {
                const response = await fetch('words.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allWordCategories = await response.json();
                 populateCategories(); // Populate dropdown after fetching
                 // Select the first category by default and start the game
                 if (allWordCategories.length > 0) {
                     categorySelect.value = allWordCategories[0].category;
                     updateCategoryWords(); // Set initial category words
                     startGame();
                 } else {
                     messageElement.textContent = "Error: No word categories found in words.json.";
                     messageElement.className = 'message text-base sm:text-lg text-red-600';
                 }

            } catch (error) {
                console.error('Error fetching words:', error);
                messageElement.textContent = 'Error loading word list. Please try again later.';
                messageElement.className = 'message text-base sm:text-lg text-red-600';
                 // Disable game elements if words cannot be loaded
                 disableGame();
            }
        }

        // Function to populate the category dropdown
        function populateCategories() {
            categorySelect.innerHTML = ''; // Clear existing options
            allWordCategories.forEach(categoryData => {
                const option = document.createElement('option');
                option.value = categoryData.category;
                option.textContent = categoryData.category;
                categorySelect.appendChild(option);
            });
        }

        // Function to update the current category words based on selection
        function updateCategoryWords() {
            const selectedCategory = categorySelect.value;
            const categoryData = allWordCategories.find(cat => cat.category === selectedCategory);
            if (categoryData) {
                currentCategoryWords = categoryData.words;
            } else {
                currentCategoryWords = []; // Fallback to empty if category not found
            }
        }


        // Function to create the keyboard buttons
        function createKeyboard() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            keyboard.innerHTML = ''; // Clear existing buttons

            for (let i = 0; i < letters.length; i++) {
                const button = document.createElement('button');
                button.classList.add('keyboard-button');
                button.textContent = letters[i];
                button.addEventListener('click', handleLetterClick);
                keyboard.appendChild(button);
            }
        }

        // Function to handle a letter button click
        function handleLetterClick(event) {
            const guessedLetter = event.target.textContent; // Get the letter from the button

            // Disable the clicked button immediately
            event.target.disabled = true;

            handleGuess(guessedLetter); // Pass the guessed letter to the main guess handling function
        }


        // Function to start a new game (resets everything)
        function startGame() {
             if (currentCategoryWords.length === 0) {
                 messageElement.textContent = "No words available for the selected category.";
                 messageElement.className = 'message text-base sm:text-lg text-red-600';
                 disableGame();
                 return;
             }
            // Choose a random word from the current category
            secretWord = currentCategoryWords[Math.floor(Math.random() * currentCategoryWords.length)];
            maskedWord = '_'.repeat(secretWord.length); // Initialize masked word with underscores
            incorrectAttempts = 0; // Reset incorrect attempts
            guessedLetters = []; // Clear guessed letters

            // Reset the display
            wordDisplay.textContent = maskedWord.split('').join(' '); // Display with spaces
            messageElement.textContent = '';
            guessesElement.textContent = `Incorrect Guesses Left: ${maxIncorrectAttempts - incorrectAttempts}`;
            incorrectGuessesElement.textContent = 'Incorrect Guesses: ';
            restartButton.classList.add('hidden'); // Hide restart button
            // Reset message class - remove specific color classes
            messageElement.className = 'message text-base sm:text-lg';

             // Ensure animation element is hidden and reset
            winningWordAnimationElement.textContent = '';
            winningWordAnimationElement.classList.remove('animate');

            createKeyboard(); // Recreate the keyboard for a new game

            // Enable game elements
            enableGame();

        }

        // Function to change the word without changing the category
        function changeWord() {
             if (currentCategoryWords.length === 0) {
                 messageElement.textContent = "No words available for the selected category.";
                 messageElement.className = 'message text-base sm:text-lg text-red-600';
                 disableGame();
                 return;
             }
             // Choose a new random word from the current category
             let newSecretWord = secretWord;
             // Ensure the new word is different from the current one if possible
             if (currentCategoryWords.length > 1) {
                 while (newSecretWord === secretWord) {
                     newSecretWord = currentCategoryWords[Math.floor(Math.random() * currentCategoryWords.length)];
                 }
             }
             secretWord = newSecretWord;

             maskedWord = '_'.repeat(secretWord.length); // Initialize masked word with underscores
             incorrectAttempts = 0; // Reset incorrect attempts
             guessedLetters = []; // Clear guessed letters

             // Reset the display
             wordDisplay.textContent = maskedWord.split('').join(' '); // Display with spaces
             messageElement.textContent = '';
             guessesElement.textContent = `Incorrect Guesses Left: ${maxIncorrectAttempts - incorrectAttempts}`;
             incorrectGuessesElement.textContent = 'Incorrect Guesses: ';
             restartButton.classList.add('hidden'); // Hide restart button
             // Reset message class - remove specific color classes
             messageElement.className = 'message text-base sm:text-lg';

             // Ensure animation element is hidden and reset
             winningWordAnimationElement.textContent = '';
             winningWordAnimationElement.classList.remove('animate');

             createKeyboard(); // Recreate the keyboard to enable all buttons

             // Enable game elements
             enableGame();
        }


        // Function to handle a letter guess (now accepts the letter directly)
        function handleGuess(guess) {
            // Validate input (already done by keyboard structure, but good for safety)
            if (guess.length !== 1 || !/^[A-Z]$/.test(guess)) {
                messageElement.textContent = 'Invalid input.'; // Should not happen with keyboard
                messageElement.className = 'message text-base sm:text-lg text-red-600';
                return;
            }

            // Check if letter has already been guessed (disabled button handles this visually)
            if (guessedLetters.includes(guess)) {
                 // This case should be less frequent with disabled buttons, but kept for logic
                messageElement.textContent = `You already guessed the letter "${guess}".`;
                messageElement.className = 'message text-base sm:text-lg text-orange-600';
                return;
            }

            guessedLetters.push(guess); // Add the guessed letter to the list


            // Check if the letter is in the secret word
            if (secretWord.includes(guess)) {
                messageElement.textContent = `Good guess! "${guess}" is in the word.`;
                messageElement.className = 'message text-base sm:text-lg text-green-600';

                // Update the masked word
                let newMaskedWord = '';
                for (let i = 0; i < secretWord.length; i++) {
                    if (secretWord[i] === guess) {
                        newMaskedWord += guess;
                    } else {
                        // Find the character in the current maskedWord string at index i
                        // and append it to the newMaskedWord.
                        // This is necessary because maskedWord is a string of underscores and correctly guessed letters.
                         newMaskedWord += maskedWord[i];
                    }
                }
                maskedWord = newMaskedWord;
                wordDisplay.textContent = maskedWord.split('').join(' '); // Update display

                // Check for win
                if (!maskedWord.includes('_')) {
                    messageElement.textContent = `Congratulations! You guessed the word "${secretWord}"!`;
                    messageElement.className = 'message text-base sm:text-lg text-green-600';
                    triggerWinningAnimation(secretWord); // Trigger the animation
                    endGame(true);
                }

            } else {
                messageElement.textContent = `Sorry, "${guess}" is not in the word.`;
                messageElement.className = 'message text-base sm:text-lg text-orange-600';
                incorrectAttempts++; // Increment incorrect attempts
                guessesElement.textContent = `Incorrect Guesses Left: ${maxIncorrectAttempts - incorrectAttempts}`;
                incorrectGuessesElement.textContent += guess + ' '; // Display incorrect guess

                // Check for loss
                if (incorrectAttempts >= maxIncorrectAttempts) {
                    messageElement.textContent = `Game Over! The word was "${secretWord}".`;
                    messageElement.className = 'message text-base sm:text-lg text-red-600';
                    endGame(false);
                }
            }
        }

         // Function to trigger the winning word animation
        function triggerWinningAnimation(word) {
            winningWordAnimationElement.textContent = word; // Set the word
            winningWordAnimationElement.classList.add('animate'); // Add the animation class

            // Remove the animation class after the animation finishes
            setTimeout(() => {
                winningWordAnimationElement.classList.remove('animate');
                winningWordAnimationElement.textContent = ''; // Clear the word
            }, 1500); // Match the animation duration (1.5s)
        }


        // Function to end the game
        function endGame(won) {
             // Disable all keyboard buttons
             const buttons = keyboard.querySelectorAll('button');
             buttons.forEach(button => button.disabled = true);

             restartButton.classList.remove('hidden'); // Show restart button
             categorySelect.disabled = false; // Enable category selection after the game
             changeWordButton.disabled = false; // Enable change word button
        }

        // Function to disable game elements (e.g., if words fail to load)
        function disableGame() {
             const buttons = keyboard.querySelectorAll('button');
             buttons.forEach(button => button.disabled = true);
             restartButton.classList.add('hidden');
             categorySelect.disabled = true;
             changeWordButton.disabled = true; // Disable change word button
        }

         // Function to enable game elements
        function enableGame() {
             const buttons = keyboard.querySelectorAll('button');
             buttons.forEach(button => button.disabled = false);
             categorySelect.disabled = false;
             changeWordButton.disabled = false; // Enable change word button
        }


        // Function to toggle theme
        function toggleTheme() {
            body.classList.toggle('dark-mode');
            gameInfoContainer.classList.toggle('dark-mode'); // Toggle class on info container
            gameKeyboardContainer.classList.toggle('dark-mode'); // Toggle class on keyboard container


            // Update local storage
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                // Show moon icon, hide sun icon
                themeToggle.querySelector('.ph-moon').classList.remove('hidden');
                themeToggle.querySelector('.ph-sun').classList.add('hidden');
            } else {
                localStorage.setItem('theme', 'light');
                 // Show sun icon, hide moon icon
                themeToggle.querySelector('.ph-sun').classList.remove('hidden');
                themeToggle.querySelector('.ph-moon').classList.add('hidden');
            }
        }

        // Function to apply theme on page load
        function applyTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                gameInfoContainer.classList.add('dark-mode');
                gameKeyboardContainer.classList.add('dark-mode');
                 // Show moon icon, hide sun icon
                themeToggle.querySelector('.ph-moon').classList.remove('hidden');
                themeToggle.querySelector('.ph-sun').classList.add('hidden');
            } else {
                 // Ensure light mode is applied if no preference or 'light' is saved
                 body.classList.remove('dark-mode');
                 gameInfoContainer.classList.remove('dark-mode');
                 gameKeyboardContainer.classList.remove('dark-mode');
                 // Show sun icon, hide moon icon
                 themeToggle.querySelector('.ph-sun').classList.remove('hidden');
                 themeToggle.querySelector('.ph-moon').classList.add('hidden');
            }
        }


        // Add event listeners
        restartButton.addEventListener('click', startGame);
        themeToggle.addEventListener('click', toggleTheme); // Add event listener for theme toggle
        categorySelect.addEventListener('change', function() {
            updateCategoryWords(); // Update words list when category changes
            startGame(); // Start a new game with the selected category
        });
        changeWordButton.addEventListener('click', changeWord); // Add event listener for Change Word button


        // Fetch words and apply theme when the page loads
        window.onload = function() {
            applyTheme(); // Apply theme preference first
            fetchWords(); // Fetch words and start the game after theme is applied
        };

    </script>
</body>
</html>
